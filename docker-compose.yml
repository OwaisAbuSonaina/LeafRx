services:
  backend:
    container_name: LeafRx_backend
    build: ./backend
    ports:
      - "8000:8000"
    restart: always

  frontend:
    container_name: LeafRx_frontend
    build: ./frontend
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://backend:8000/predict
    depends_on:
      - backend
    restart: always
